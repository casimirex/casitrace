name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configure environment
        run: cp .env.example .env

      - name: Start services (Postgres, S3, Mailpit)
        run: docker compose up -d --wait postgres s3 mailpit && docker compose up s3-init

      - name: Install dependencies (also generates the Prisma client)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: OpenAPI client is up to date
        run: |
          bun run openapi
          git diff --exit-code packages/api-client/ || (echo "Run 'bun run openapi' and commit the result." && exit 1)

      - name: Typecheck
        run: bun run typecheck

      - name: Migrations apply to a fresh database
        run: bun run db:deploy

      - name: Unit and integration tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: E2E smoke
        run: bun run e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
