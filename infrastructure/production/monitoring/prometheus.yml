# Scrapes the API and worker over the internal network; alert rules in alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    authorization: { credentials_file: /etc/prometheus/metrics-token }
    static_configs: [{ targets: ["api:3000"] }]
  - job_name: worker
    metrics_path: /metrics
    authorization: { credentials_file: /etc/prometheus/metrics-token }
    static_configs: [{ targets: ["worker:9464"] }]
