# Casitrace pilot deployment: one EU virtual machine running Docker Compose (ADR 0015).
# The same file runs the local staging rehearsal (`infrastructure/production/staging.sh`).
#
# Only `web` (Caddy) publishes a port to the internet. Everything else is on the internal network.
# Secrets come from .env (see .env.example next to this file); never commit it.
name: casitrace-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://casitrace_app:${APP_DB_PASSWORD}@postgres:5432/casitrace
  WEB_ORIGIN: ${WEB_ORIGIN}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-${WEB_ORIGIN}}
  AUTH_SECRET: ${AUTH_SECRET}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  PASSPORT_SIGNER: kms
  KMS_ADDR: ${KMS_ADDR:-http://openbao:8200}
  KMS_KEY_NAME: passport-signing
  KMS_ROLE_ID: ${KMS_ROLE_ID}
  KMS_SECRET_ID: ${KMS_SECRET_ID}
  PASSPORT_PREVIOUS_KEYS: ${PASSPORT_PREVIOUS_KEYS:-[]}
  METRICS_TOKEN: ${METRICS_TOKEN}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://otel:4318/v1/traces}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"

x-walg-env: &walg-env
  WALG_S3_PREFIX: ${BACKUP_S3_PREFIX}
  AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT}
  AWS_REGION: ${BACKUP_S3_REGION}
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
  # Backups are encrypted client-side before upload (key kept in the secrets manager, not on the VM disk image).
  WALG_LIBSODIUM_KEY: ${BACKUP_ENCRYPTION_KEY}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  WALG_COMPRESSION_METHOD: zstd

services:
  web:
    image: ${IMAGE_PREFIX:-casitrace}/web:${IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: infrastructure/production/Dockerfile, target: web }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports: ["${PUBLIC_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, internal]
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-casitrace}/app:${IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: infrastructure/production/Dockerfile, target: app }
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      openbao: { condition: service_healthy }
    healthcheck:
      test:
        ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/ready');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]
    restart: unless-stopped

  worker:
    image: ${IMAGE_PREFIX:-casitrace}/app:${IMAGE_TAG:-latest}
    command: ["bun", "apps/worker/src/main.ts"]
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9464/health');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  migrate:
    image: ${IMAGE_PREFIX:-casitrace}/migrate:${IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: infrastructure/production/Dockerfile, target: migrate }
    environment:
      MIGRATE_DATABASE_URL: postgresql://casitrace:${DB_OWNER_PASSWORD}@postgres:5432/casitrace
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  postgres:
    image: ${IMAGE_PREFIX:-casitrace}/postgres:${IMAGE_TAG:-latest}
    build: { context: ../.., dockerfile: infrastructure/production/postgres/Dockerfile }
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      # Ship a WAL segment at least every 60 s: worst-case data loss ≈ 1 minute (RPO target ≤ 24 h).
      - -c
      - archive_timeout=60
      - -c
      - max_connections=100
    environment:
      <<: *walg-env
      POSTGRES_USER: casitrace
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      POSTGRES_DB: casitrace
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casitrace -d casitrace"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  backup:
    image: ${IMAGE_PREFIX:-casitrace}/postgres:${IMAGE_TAG:-latest}
    entrypoint: ["/usr/local/bin/backup-loop.sh"]
    environment:
      <<: *walg-env
      PGHOST: postgres
      PGUSER: casitrace
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      PGDATABASE: casitrace
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes: [pgdata:/var/lib/postgresql/data:ro]
    depends_on:
      # Records each backup in ops_backup_run, which the migrations create.
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  # Daily copy of evidence objects to the backup storage, each checked against its SHA-256 in the
  # database (docs/operations/runbooks/restore.md § B).
  evidence-mirror:
    image: ${IMAGE_PREFIX:-casitrace}/app:${IMAGE_TAG:-latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          bun scripts/ops/mirror-evidence.ts mirror || echo "EVIDENCE MIRROR FAILED" >&2
          sleep 86400
        done
    environment:
      OWNER_DATABASE_URL: postgresql://casitrace:${DB_OWNER_PASSWORD}@postgres:5432/casitrace
      SOURCE_ENDPOINT: ${S3_ENDPOINT}
      SOURCE_REGION: ${S3_REGION}
      SOURCE_BUCKET: ${S3_BUCKET}
      SOURCE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      SOURCE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BACKUP_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_REGION: ${BACKUP_S3_REGION}
      BACKUP_BUCKET: ${BACKUP_EVIDENCE_BUCKET:-casitrace-evidence-backup}
      BACKUP_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      BACKUP_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  # Key management (ADR 0015). Server mode, file storage; initialised and unsealed by an operator
  # (docs/operations/runbooks/key-rotation.md). The API authenticates with AppRole.
  openbao:
    image: openbao/openbao:2.4.1
    command: server -config=/openbao/config/openbao.hcl
    volumes:
      - baodata:/openbao/file
      - baologs:/openbao/logs
      - ./kms/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ./kms:/openbao/kms:ro
    healthcheck:
      # Healthy only when initialised and unsealed (sys/health returns 200).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [internal]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.3
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [internal]
    restart: unless-stopped

  # Monitoring: Prometheus scrapes and evaluates alert rules; Alertmanager routes alerts by email;
  # otel (Grafana LGTM) receives traces and serves dashboards on the internal network.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=:9090
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/metrics-token:/etc/prometheus/metrics-token:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [internal]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: [./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    ports: ["127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"]
    networks: [internal]
    restart: unless-stopped

  otel:
    image: grafana/otel-lgtm:0.11.10
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes: [otel:/data]
    networks: [internal]
    restart: unless-stopped

networks:
  edge: {}
  internal: {}

volumes:
  pgdata:
  baodata:
  baologs:
  clamdb:
  promdata:
  otel:
