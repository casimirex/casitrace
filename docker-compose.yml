name: casitrace

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: casitrace
      POSTGRES_PASSWORD: casitrace
      POSTGRES_DB: casitrace
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casitrace -d casitrace"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for local dev and CI (ADR 0011). MinIO images are no longer published.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["9000:8333"]
    volumes:
      - s3data:/data
      - ./infrastructure/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  s3-init:
    image: chrislusf/seaweedfs:3.97
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in casitrace-evidence casitrace-evidence-test; do
          echo "s3.bucket.create -name $$b" | weed shell -master=s3:9333 2>&1 | grep -v 'already exists' || true
        done
        echo "s3.bucket.list" | weed shell -master=s3:9333

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  s3data:
